# bootstrap-agent-example.yaml
# ---------------------------------------------------------------------------
# Annotated example of a baseline profile. Every agent built with this toolkit
# inherits these values unless it overrides them.
#
# Canonical location:  ~/.agent-toolkit/baseline.yaml
#                      (override with $AGENT_TOOLKIT_HOME)
#
# Precedence, lowest to highest:
#   baseline profile -> agent override -> CLI flag -> in-session instruction
#
# NEVER put a secret in this file. Reference env vars as env:VAR_NAME.
# See docs/environment-variables.md.
# ---------------------------------------------------------------------------

schema_version: 2

identity_context:
  # Language + region. Drives date/number/currency formatting.
  # Inferred from system locale in Express mode.
  locale: "en-AU"

  # Industry or subject area agents mostly work in. Free text.
  # e.g. "financial services" | "software engineering" | "legal" | "general"
  domain: "general"

  # Who the output is usually for.
  # Options: internal_team | external_client | technical | non_technical | mixed
  audience: "internal_team"

voice_style:
  # Free text. Two or three adjectives works better than a paragraph.
  tone_of_voice: "neutral, direct"

  # Whether agents present as a named character or stay utilitarian.
  # Options: none | named
  persona: "none"

  # Default output length/density.
  # Options: concise | standard | expansive
  verbosity: "concise"

  formatting_conventions:
    headers: true
    tables: "when_useful"          # always | when_useful | never
    code_blocks: "fenced_with_language"

operating_constraints:
  # Default model. Deliberately mid-tier — agents override UP when a task
  # genuinely needs it. Defaulting everything to top-tier is how cost blows out.
  model: "claude-sonnet-5"

  # Default agent pattern. Enumerated, not free text. Start simple.
  # Options: standalone (default) | pipeline | router | parallel
  #        | orchestrator-workers (aka hierarchical-supervisory)
  #        | evaluator-optimizer
  #        | collaborative (aka peer-to-peer/swarm)
  pattern: "standalone"

  guardrails:
    input_filtering: true
    tool_use_limits: "default"     # default | strict | none
    output_validation: true        # the Balanced risk posture; see the schema's
                                   # x-composite-questions for all three rows
    human_in_the_loop: false       # pause for approval before irreversible actions

  evaluation_loop:
    enabled: false                 # true adds a review pass before returning output
    reviewer: null                 # self | evaluator-agent | null
    max_cycles: 3                  # cap iterations so a loop can't run away

  permissions_scope:
    filesystem: "workspace_only"   # workspace_only | read_only | full
    # Closed vocabulary: file.read | file.search | file.write | shell
    #                  | web.search | web.fetch | subagent
    # Arrays REPLACE wholesale — to add one, list them all.
    capabilities: ["file.read", "file.search", "file.write", "web.search", "web.fetch"]
    web:
      allowed_domains: []          # empty means "no allow-list", not "none allowed"
      blocked_domains: []          # both bound web.fetch only

  safety_compliance_profile: "default"

  cost_performance_budget:
    max_tokens_per_run: 4000
    latency_target_seconds: 30

knowledge_memory:
  default_context_sources: []   # paths loaded on start; reusable guidance
                                # belongs in library/ and is composed instead

  memory_behaviour: "stateless"    # stateless | persistent

  context_management:
    tool_output_token_cap: 25000   # cap per tool response, prevents context exhaustion
    clear_stale_tool_calls: true   # auto-clear old tool calls as token limits approach

interop:
  # Markdown by default — these outputs are for humans. Use json only where a
  # downstream agent or tool specifically needs to parse the result.
  # Options: markdown | json | plain_text | file
  output_format_contract: "markdown"

  # Agent output goes here, not the project root.
  output_location: "./output"

  # Where the agent hands off when it hits its limits.
  escalation_path: "human_review"  # human_review | <name of another agent>

steering:
  # chat_and_bulk lets you write considered guidance offline into a file and have
  # the agent apply it on request, instead of only giving feedback turn by turn.
  feedback_mode: "chat_and_bulk"   # chat_and_bulk | chat_only
  bulk_feedback_file: "./steering.md"

# ---------------------------------------------------------------------------
# Credentials — names only, never values.
# Set the actual values as environment variables. See docs/environment-variables.md
# ---------------------------------------------------------------------------
credentials:
  anthropic_api_key: "env:ANTHROPIC_API_KEY"
  # example_service_token: "env:EXAMPLE_SERVICE_TOKEN"