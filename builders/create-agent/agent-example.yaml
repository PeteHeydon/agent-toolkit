# agent-example.yaml
# ---------------------------------------------------------------------------
# Annotated example of an agent override file, showing every overridable field
# and its legal options.
#
# IMPORTANT: this is a REFERENCE, not a starting point. A real agent.yaml should
# be nearly empty. Everything shown below the identity block is commented out
# because the correct default for almost every field is: don't set it, inherit it.
#
# Written to:  <dest>/<agent-name>/agent.yaml
#              default dest ~/.agent-toolkit/agents/
#
# Precedence:  baseline -> THIS FILE -> CLI flag -> in-session instruction.
# Arrays REPLACE wholesale, they never append: to keep the baseline's list and
# add one entry, list them all. Full merge rules:
#   docs/precedence-and-inheritance.md
#
# NEVER put a secret here. Use env:VAR_NAME. See docs/environment-variables.md
# ---------------------------------------------------------------------------

schema_version: 2

# --- Required identity -----------------------------------------------------

# What this agent inherits from. Explicit rather than assumed, so the agent is
# self-describing and can point at a different baseline (work vs personal)
# without any change to the resolver.
extends: "~/.agent-toolkit/baseline.yaml"

# Slug: lowercase, digits, hyphens, starting with a letter. Matches the directory.
name: "example-agent"

description: "One line on what this agent does."

# ---------------------------------------------------------------------------
# Overrides — everything below is COMMENTED OUT deliberately.
#
# Uncomment only what genuinely differs from your baseline. An override that
# restates the baseline value is worse than nothing: it's noise, and it silently
# pins that field so future baseline edits stop reaching this agent.
# validate-agent.py warns when it finds one.
# ---------------------------------------------------------------------------

# identity_context:
#   locale: "en-GB"
