schema_version: 1

identity_context:
  locale: "en-AU"
  audience: "internal_team"

voice_style:
  tone_of_voice: "neutral, direct"
  persona: "none"
  verbosity: "concise"
  formatting_conventions:
    headers: true
    tables: "when_useful"
    code_blocks: "fenced_with_language"

operating_constraints:
  model: "claude-sonnet-4-6"
  pattern: "standalone"
  guardrails:
    input_filtering: true
    tool_use_limits: "default"
    output_validation: false
    human_in_the_loop: false
  evaluation_loop:
    enabled: false
    reviewer: null
    max_cycles: 3
  permissions_scope:
    filesystem: "workspace_only"
    tools: ["read", "write", "search"]
    external_calls: false
  safety_compliance_profile: "default"
  cost_performance_budget:
    max_tokens_per_run: 4000
    latency_target_seconds: 30

knowledge_memory:
  default_context_sources:
    - "skills/core"
  memory_behaviour: "stateless"
  context_management:
    tool_output_token_cap: 25000
    clear_stale_tool_calls: true

interop:
  output_format_contract: "markdown"
  output_location: "./output"
  escalation_path: "human_review"

steering:
  feedback_mode: "chat_and_bulk"
  bulk_feedback_file: "./steering.md"

credentials:
  anthropic_api_key: "env:ANTHROPIC_API_KEY"
